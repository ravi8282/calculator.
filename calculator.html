<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bootstrap Calculator</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="calculator-wrap d-flex align-items-center min-vh-100 py-4">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-4">
          <div class="card calc-card shadow-lg">
            <div class="card-body">
              <div class="mb-3">
                <input
                  id="display"
                  class="form-control form-control-lg text-end calc-display"
                  type="text"
                  value="0"
                  readonly
                  aria-label="Calculator display"
                />
              </div>
              <div class="d-grid gap-2">
                <div class="row g-2">
                  <div class="col-3"><button class="btn btn-light w-100 btn-fn" data-action="clear">AC</button></div>
                  <div class="col-3"><button class="btn btn-light w-100 btn-fn" data-action="delete">DEL</button></div>
                  <div class="col-3"><button class="btn btn-light w-100 btn-op" data-value="%">%</button></div>
                  <div class="col-3"><button class="btn btn-warning w-100 btn-op" data-value="/">&divide;</button></div>
                </div>
                <div class="row g-2">
                  <div class="col-3"><button class="btn btn-dark w-100" data-value="7">7</button></div>
                  <div class="col-3"><button class="btn btn-dark w-100" data-value="8">8</button></div>
                  <div class="col-3"><button class="btn btn-dark w-100" data-value="9">9</button></div>
                  <div class="col-3"><button class="btn btn-warning w-100 btn-op" data-value="*">&times;</button></div>
                </div>
                <div class="row g-2">
                  <div class="col-3"><button class="btn btn-dark w-100" data-value="4">4</button></div>
                  <div class="col-3"><button class="btn btn-dark w-100" data-value="5">5</button></div>
                  <div class="col-3"><button class="btn btn-dark w-100" data-value="6">6</button></div>
                  <div class="col-3"><button class="btn btn-warning w-100 btn-op" data-value="-">&minus;</button></div>
                </div>
                <div class="row g-2">
                  <div class="col-3"><button class="btn btn-dark w-100" data-value="1">1</button></div>
                  <div class="col-3"><button class="btn btn-dark w-100" data-value="2">2</button></div>
                  <div class="col-3"><button class="btn btn-dark w-100" data-value="3">3</button></div>
                  <div class="col-3"><button class="btn btn-warning w-100 btn-op" data-value="+">+</button></div>
                </div>
                <div class="row g-2">
                  <div class="col-6"><button class="btn btn-dark w-100" data-value="0">0</button></div>
                  <div class="col-3"><button class="btn btn-dark w-100" data-value=".">.</button></div>
                  <div class="col-3"><button class="btn btn-success w-100" data-action="equals">=</button></div>
                </div>
              </div>
            </div>
            <div class="card-footer text-center small text-muted">
              Built with Bootstrap 5
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
